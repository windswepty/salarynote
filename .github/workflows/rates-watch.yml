name: rates-watch

# 요율 자동 갱신 감시.
#
# ★갱신 주기가 항목마다 달라도 워크플로를 나누지 않는다.★
#   4대보험 1/1 · 간이세액표 2월말 · 기준소득월액 7/1 · 최저임금 8월초 — 넷 다
#   "언제 바뀔지 정확히 모른다". 날짜 지정 cron 은 GitHub 이 공식 인정한 예약 드롭
#   위험 때문에 '1년에 한 번뿐인 기회' 를 통째로 날린다. 매일 전 출처를 점검한다.
#   비용은 월 2,000분 중 5% 미만이다.
#
# ★3시간마다 도는 이유는 한국 정부망이 간헐적으로 막히기 때문이다.★
#   실측: www.law.go.kr·www.minimumwage.go.kr 은 27.101.x 대역인데 러너 IP 에
#   따라 TCP SYN 이 통째로 무응답이 된다(#5). 같은 워크플로가 30분 전에는
#   384ms 로 붙었다(#4). 우리 코드 문제가 아니라 그 순간 러너 IP 의 문제다.
#   막힌 러너에서 재시도해 봐야 같은 IP 라 소용없으므로, 짧게 포기하고 다음
#   실행에 맡긴다. 실패율이 절반이어도 하루 8번이면 전부 실패할 확률은 0.4% 다.
#   비용은 월 2,000분 중 약 36%.
#
# ★cron 은 UTC 다.★ KST = UTC+9 (한국은 1988년 이후 서머타임 없음).
#   정각(분 00)과 :30 은 고부하 시간대라 피한다.
#   on.schedule 의 timezone: 키는 비교적 최근 기능이라 쓰지 않았다. Asia/Seoul 은
#   DST 가 없어 UTC 산술과 실행 시각이 완전히 동일하다.
#
# ★예약 워크플로는 기본 브랜치(main)의 최신 커밋으로만 돈다.★
#   브랜치에서 cron 을 테스트할 수 없으므로 workflow_dispatch 를 반드시 병기한다.

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: '대상 연도 (비우면 오늘 연도)'
        required: false
        default: ''
      dry_run:
        description: '원장에 쓰지 않고 리포트만'
        type: boolean
        required: false
        default: false

concurrency:
  group: rates-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 기본 360분이다. law.go.kr 이 hang 하면 6시간을 태운다.
    timeout-minutes: 20
    # 미지정 스코프는 자동으로 none 이 된다. 최소권한이 이걸로 성립한다.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      LAW_OC: ${{ secrets.LAW_OC }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      # 최저임금 고시는 유일하게 PDF 로만 제공된다(admrul 의 조문내용이 빈 문자열).
      # 이게 없으면 최저임금이 단일 출처가 되어 자동 병합 대상에서 빠진다.
      - name: poppler-utils 설치 (최저임금 고시 PDF 파싱)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 대상 연도 결정
        id: cfg
        run: |
          Y="${{ github.event.inputs.year }}"
          [ -z "$Y" ] && Y=$(date -u -d '+9 hours' +%Y)   # KST 기준 연도
          echo "year=$Y" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u -d '+9 hours' +%F)" >> "$GITHUB_OUTPUT"
          echo "대상 연도 $Y"

      # ★라벨이 없으면 이슈 생성이 통째로 실패한다.★
      # gh issue create 는 존재하지 않는 라벨을 만나면 이슈를 만들지 않고 죽는다.
      # 실제로 그래서 "could not add label: 'rates-alert' not found" 로 경보가
      # 발송되지 않았다. 문제를 알리는 장치가 문제 때문에 침묵한 셈이다.
      # 라벨 생성은 멱등이므로 매 실행 앞에서 보장한다.
      - name: 라벨 보장
        run: |
          set -e
          ensure() {
            gh label create "$1" --color "$2" --description "$3" --force >/dev/null
            echo "  라벨 $1"
          }
          ensure rates-alert       "d73a4a" "요율 자동 갱신에 사람 개입이 필요함"
          ensure rates-update      "0e8a16" "요율 원장 갱신 후보"
          ensure tests-need-update "fbca04" "요율이 바뀌어 테스트 기대값도 고쳐야 함"

      # ★도달성 진단을 먼저 한다.★
      # 프리플라이트가 'fetch failed' 로 죽었을 때, 법제처만 막힌 것인지 한국
      # 사이트가 전부 막힌 것인지 구분할 수 없었다. 그 구분에 따라 대응이 완전히
      # 달라진다(출처 교체 vs 실행 위치 이전). 실패해도 job 을 멈추지 않고
      # 판단 재료를 남긴다. 국내 PC 에서는 5개 출처 전부 HTTP 200 이 기준선이다.
      - name: 출처 도달성 진단
        id: reach
        if: always()
        continue-on-error: true
        run: |
          node tools/reachability.js | tee "$RUNNER_TEMP/reach.md"
          cat "$RUNNER_TEMP/reach.md" >> "$GITHUB_STEP_SUMMARY"

      # ★막혔으면 조용히 끝낸다.★
      # 3시간마다 도는데 막힐 때마다 실패로 처리하면 실패 알림과 이슈가 하루
      # 몇 건씩 쌓이고, 그 소음 속에서 진짜 경보를 놓친다. 이것은 우리 쪽 결함이
      # 아니라 그 순간 러너 IP 의 문제이고, 다음 실행이 다른 IP 로 재시도한다.
      # 지속적인 실패는 healthchecks.io 가 잡는다 — 아래 핑을 건너뛰므로
      # 이틀 동안 한 번도 성공하지 못하면 메일이 온다. 그게 진짜 신호다.
      - name: 출처가 막혔으면 이번 실행은 건너뛴다
        if: steps.reach.outputs.blocked == 'yes'
        run: |
          echo "::warning::출처 도달 불가(${{ steps.reach.outputs.blocked_hosts }}). 이번 실행을 건너뜁니다. 다음 예약 실행이 다른 IP 로 재시도합니다."
          {
            echo "## 이번 실행 건너뜀"
            echo
            echo "출처에 닿지 못했습니다: \`${{ steps.reach.outputs.blocked_hosts }}\`"
            echo
            echo "한국 정부망(27.101.x)이 러너 IP 에 따라 간헐적으로 막힙니다."
            echo "3시간 뒤 다른 IP 로 자동 재시도하며, **원장은 그대로입니다**."
            echo "이틀 동안 한 번도 성공하지 못하면 healthchecks.io 가 메일로 알립니다."
          } >> "$GITHUB_STEP_SUMMARY"

      # ★프리플라이트★ OC=test 가 막히면 1차 정본 출처가 통째로 죽는다.
      # 개인 OC 는 서버 IP 등록을 요구해 유동 IP 인 GitHub Actions 에서 대체가 안 된다.
      # 여기서 조용히 넘어가면 이후 전부 '파싱 실패' 로 보여 원인을 못 찾는다.
      - name: 법제처 DRF 프리플라이트
        if: steps.reach.outputs.blocked != 'yes'
        run: |
          node -e "
            require('./tools/lib/law-go-kr.js').preflight()
              .then(r => console.log('OK OC=' + r.oc))
              .catch(e => {
                console.error('::error::' + (e.message || e));
                if (e.cause) console.error('원인: ' + (e.cause.code || e.cause.message));
                console.error('위의 [출처 도달성 진단] 표를 보면 어디서 막혔는지 알 수 있습니다.');
                process.exit(1);
              });
          "

      # ★간이세액표 646행을 원문과 대조한다.★
      # 이 표에서 소득세 전부가 나오는데, 지금까지는 사람이 한 번 만들고 끝이라
      # 매년 2월말 개정을 놓치면 조용히 틀린 세금을 계산하게 된다.
      # 값이 다르면 실패시키지 않고 기록만 한다 — 개정은 정상적인 사건이고,
      # 새 표를 원장에 반영하는 것은 사람이 판단할 일이다. 다만 놓치지는 않는다.
      - name: 간이세액표 원문 대조
        id: taxtable
        if: steps.reach.outputs.blocked != 'yes'
        continue-on-error: true
        run: |
          set +e
          node tools/parse-tax-table.js --fetch --check 2>&1 | tee "$RUNNER_TEMP/taxtable.md"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 출처 수집 (2개 이상 독립 출처)
        if: steps.reach.outputs.blocked != 'yes'
        run: |
          node tools/fetch-rates.js --year "${{ steps.cfg.outputs.year }}" \
            --out "data/candidates/observations-${{ steps.cfg.outputs.year }}.json"

      # 교차검증 + 위생검사. 통과한 값만 원장에 반영된다.
      # 종료 코드 0=통과 / 1=사람 확인 필요 / 2=FATAL.
      - name: 교차검증 · 위생검사 · 원장 반영
        id: update
        if: steps.reach.outputs.blocked != 'yes'
        run: |
          set +e
          node tools/update-rates.js \
            --year "${{ steps.cfg.outputs.year }}" \
            --observations "data/candidates/observations-${{ steps.cfg.outputs.year }}.json" \
            --today "${{ steps.cfg.outputs.today }}" \
            --report "$RUNNER_TEMP/report.md" \
            --summary "$RUNNER_TEMP/summary.json" \
            ${{ github.event.inputs.dry_run == 'true' && ' ' || '--apply' }}
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed=$(git diff --quiet -- data/ && echo no || echo yes)" >> "$GITHUB_OUTPUT"
          echo "종료 코드 $code"

      # ★원장에서 파생되는 것을 전부 다시 만든다.★
      # 예전에는 bundle.js 만 돌렸다. 그래서 원장이 실제로 갱신되는 날
      # engine.js 만 새 요율이 되고 화면 표식·푸터·실수령액표·요율표는 옛 숫자로
      # 남아 테스트가 무너졌고, 워크플로는 원장 변경을 되돌렸다. 자동 갱신이
      # 작동할 수 없는 상태였다. 목록은 build/all.js 한 곳에만 둔다.
      - name: 파생물 재생성
        if: steps.update.outputs.code == '0'
        run: node build/all.js

      # ★테스트가 깨져도 되돌리지 않는다.★
      # 엔진 테스트는 금액을 못 박아 둔다(3,000,000 × 0.9% = 27,000). 요율이 진짜
      # 바뀌면 이 값들은 실패하는 것이 정상이고, 바로 그 지점이 사람이 새 요율을
      # 눈으로 확인해야 하는 자리다. 여기서 되돌려 버리면 정작 사람이 봐야 할
      # 물건(새 요율이 담긴 PR)이 사라지고 '테스트 실패' 라는 말만 남는다.
      # 결과를 기록해 PR 본문 맨 위에 싣고, 자동 병합은 어차피 하지 않는다.
      - name: 전체 테스트
        id: tests
        if: steps.update.outputs.code == '0'
        run: |
          set +e
          : > "$RUNNER_TEMP/tests.md"
          bad=""
          for f in test/*.test.js; do
            echo "::group::$f"
            out=$(node "$f" 2>&1)
            code=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$code" != "0" ]; then
              bad="$bad $(basename "$f")"
              {
                echo "<details><summary><code>$(basename "$f")</code> 실패</summary>"
                echo
                echo '```'
                echo "$out" | grep -A3 FAIL | head -40
                echo '```'
                echo "</details>"
                echo
              } >> "$RUNNER_TEMP/tests.md"
            fi
          done
          if [ -n "$bad" ]; then
            echo "failed=yes" >> "$GITHUB_OUTPUT"
            echo "list=$bad" >> "$GITHUB_OUTPUT"
            echo "::warning::테스트 실패:$bad — 요율이 바뀌면 금액을 못 박은 테스트는 실패하는 것이 정상입니다. PR 에서 확인하십시오."
          else
            echo "failed=no" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # 값이 실제로 바뀐 경우에만 PR. main 병합 = Cloudflare Pages 즉시 배포이므로
      # 자동 병합은 하지 않는다. 사람 검토 1회를 반드시 거친다.
      - name: 값 변경 PR 생성
        id: pr
        if: steps.update.outputs.code == '0' && steps.update.outputs.changed == 'yes' && github.event.inputs.dry_run != 'true'
        run: |
          set -e
          node -e "
            const s = require(process.env.RUNNER_TEMP + '/summary.json');
            process.stdout.write(String(s.applied.length));
          " > /tmp/napplied
          N=$(cat /tmp/napplied)
          if [ "$N" = "0" ]; then
            echo "값 변경 없음(lastVerified 만 변경). PR 을 만들지 않고 하트비트 단계로 넘깁니다."
            echo "created=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BR="bot/rates-${{ steps.cfg.outputs.year }}-${{ steps.cfg.outputs.today }}"
          git config user.name  "salarynote-rates-bot"
          git config user.email "windswept1325@gmail.com"
          git checkout -b "$BR"
          # 원장뿐 아니라 파생물(화면 표식·표·번들·sitemap)까지 함께 담아야
          # PR 하나로 배포 가능한 상태가 된다.
          git add -A data/ web/
          git commit -m "[자동] ${{ steps.cfg.outputs.year }}년 요율 원장 갱신 후보 (${N}건)"
          git push -u origin "$BR"

          # 테스트 결과를 본문 맨 위에 둔다. 사람이 제일 먼저 봐야 할 정보다.
          BODY="$RUNNER_TEMP/pr.md"
          if [ "${{ steps.tests.outputs.failed }}" = "yes" ]; then
            {
              echo "## ⚠️ 병합하기 전에 확인이 필요합니다"
              echo
              echo "테스트가 실패했습니다:${{ steps.tests.outputs.list }}"
              echo
              echo "요율이 실제로 바뀌면 금액을 못 박아 둔 테스트는 **실패하는 것이 정상**입니다."
              echo "새 요율이 맞는지 아래 근거를 확인하고, 맞다면 테스트의 기대값도 함께 고쳐야 합니다."
              echo
              cat "$RUNNER_TEMP/tests.md"
              echo "---"
              echo
            } > "$BODY"
          else
            {
              echo "## ✅ 전체 테스트 통과"
              echo
              echo "그래도 자동 병합하지 않습니다. 근거를 확인한 뒤 병합하십시오."
              echo
            } > "$BODY"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$BODY"

          LABELS="rates-update"
          [ "${{ steps.tests.outputs.failed }}" = "yes" ] && LABELS="rates-update,tests-need-update"
          gh pr create \
            --title "[자동] ${{ steps.cfg.outputs.year }}년 요율 원장 갱신 (${N}건)" \
            --body-file "$BODY" \
            --label "$LABELS" \
            --assignee windswepty \
            --base main --head "$BR"
          echo "created=yes" >> "$GITHUB_OUTPUT"

      # 하트비트 — 값 변경이 없어도 '확인했다' 는 기록을 남긴다.
      # ★매일 커밋하면 Cloudflare Pages 가 매일 재배포된다.★ 내용이 같은 번들을
      # 매일 배포하는 것은 무의미한 churn 이므로 7일에 한 번만 민다.
      # 진짜 생존 신호는 아래의 외부 dead-man switch 다.
      - name: 하트비트 커밋 (7일에 한 번)
        if: steps.update.outputs.code == '0' && steps.pr.outputs.created != 'yes' && github.event.inputs.dry_run != 'true'
        run: |
          set -e
          # update-rates --apply 가 이미 작업 트리의 lastVerified 를 오늘로 바꿔 놨다.
          # '직전에 커밋된' 값과 비교해야 하므로 HEAD 의 내용을 읽는다.
          LAST=$(git show "HEAD:data/rates-${{ steps.cfg.outputs.year }}.json" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).lastVerified));
          ")
          DAYS=$(( ( $(date -u -d "${{ steps.cfg.outputs.today }}" +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "직전 lastVerified=$LAST (${DAYS}일 전)"
          if [ "$DAYS" -lt 7 ]; then
            echo "7일이 안 됐습니다. 하트비트 커밋을 건너뜁니다(불필요한 재배포 방지)."
            git checkout -- data/ web/assets/engine.js || true
            exit 0
          fi
          node build/all.js
          git config user.name  "salarynote-rates-bot"
          git config user.email "windswept1325@gmail.com"
          git add -A data/ web/
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "[자동] 요율 확인 기록 갱신 (lastVerified=${{ steps.cfg.outputs.today }}, 숫자 변경 없음)"
          git push origin HEAD:main

      # 낡음 감시 — '실패 시 멈춤' 은 감시가 없으면 무기한 침묵이 된다.
      - name: 낡음(staleness) 감시
        id: stale
        if: always() && steps.reach.outputs.blocked != 'yes'
        run: |
          set +e
          node tools/sanity-check.js "data/rates-${{ steps.cfg.outputs.year }}.json" \
            --staleness --today "${{ steps.cfg.outputs.today }}" > "$RUNNER_TEMP/stale.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/stale.md"
          # ★WARN 은 종료 코드 0 이라 그대로 두면 아무 데도 나가지 않는다.★
          # 실제로 '2027년 최저임금 고시 확인 필요' 라는 살아 있는 신호가 몇 주째
          # 삼켜지고 있었다(확인해 보니 이미 시급 10,700원으로 고시돼 있었다).
          # 낡음 경보는 '지금 틀렸다' 가 아니라 '곧 틀려진다' 는 뜻이라 조용히
          # 묻히기 쉽고, 그래서 오히려 더 위험하다. 별도 신호로 뽑아 알림에 태운다.
          if grep -q "^## WARN" "$RUNNER_TEMP/stale.md"; then
            echo "warn=yes" >> "$GITHUB_OUTPUT"
          else
            echo "warn=no" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/stale.md" >> "$GITHUB_STEP_SUMMARY"

      # ★외부 dead-man switch — 이게 이 워크플로에서 가장 중요한 한 줄이다.★
      # GitHub 은 '실패' 만 알린다. '예약 실행이 드롭됨' / '워크플로 비활성화' /
      # '월 2,000분 소진' 세 가지 침묵 실패는 절대 알려주지 못한다.
      # 이 프로젝트가 두려워하는 것(몇 달간 틀린 요율)은 전부 그 셋에서 나온다.
      # ★핑은 "오늘 실제로 요율을 확인했다" 는 뜻이어야 한다.★
      # 아래 두 경우에는 보내지 않는다. 보내면 며칠째 아무것도 확인하지 못하고
      # 있는데도 healthchecks 가 정상으로 보고, 이 장치의 존재 이유가 사라진다.
      #
      #  1. 출처가 막힌 실행 — 하나도 못 읽었다.
      #  2. 위생검사가 BLOCK/FATAL 로 끝난 실행 — 값을 신뢰할 수 없어 폐기했다.
      #
      # 특히 2번이 함정이었다. 교차검증 단계는 set +e 로 종료 코드를 출력으로만
      # 넘기므로 그 단계 자체는 성공한다. 그래서 FATAL 이어도 success() 가 참이고,
      # 핑이 먼저 나간 뒤 맨 마지막 'FATAL 이면 실패 처리' 단계에서야 job 이
      # 실패했다. 즉 사람에게는 실패로 보이는데 dead-man switch 에는 정상으로
      # 찍히는 상태였다.
      - name: 하트비트 핑 (healthchecks.io)
        if: |
          success()
          && steps.reach.outputs.blocked != 'yes'
          && steps.update.outputs.code == '0'
        run: |
          if [ -z "${{ secrets.HEALTHCHECK_URL }}" ]; then
            echo "::warning::HEALTHCHECK_URL 시크릿이 없습니다. 외부 dead-man switch 없이는 '워크플로가 아예 안 돈 것' 을 아무도 알 수 없습니다. 반드시 설정하십시오."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}"

      # 사람 확인이 필요하거나(1) FATAL(2)이거나 낡음 경보가 있으면 이슈.
      # ★assign 은 watch 설정과 무관하게 알림을 보장한다.★
      # 매일 도는 워크플로이므로 중복 방지가 없으면 이슈가 365개 쌓인다.
      - name: 이슈 생성 / 코멘트
        if: |
          always()
          && steps.reach.outputs.blocked != 'yes'
          && (failure() || steps.update.outputs.code != '0' || steps.stale.outputs.code == '2'
              || steps.taxtable.outputs.code != '0' || steps.stale.outputs.warn == 'yes')
        run: |
          set -e
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$RUNNER_TEMP/issue.md"
          {
            if [ "$URGENT" = "no" ]; then
              echo "### 지금 틀린 것은 없습니다"
              echo
              echo "낡음(staleness) 경보입니다. 값이 곧 바뀔 시점이 됐다는 뜻이며,"
              echo "**원장과 사이트는 지금도 정확합니다.** 아래 WARN 항목을 확인해 주세요."
              echo
              echo "---"
              echo
            else
              echo "자동 갱신 실행에서 사람 개입이 필요합니다."
            fi
            echo
            echo "- 실행 로그: $URL"
            echo "- update-rates 종료 코드: \`${{ steps.update.outputs.code }}\` (0=통과 / 1=사람 확인 / 2=FATAL)"
            echo "- **원장은 변경되지 않았습니다. 사이트는 마지막 정상값으로 계속 동작합니다.**"
            echo
            [ -f "$RUNNER_TEMP/report.md" ] && cat "$RUNNER_TEMP/report.md"
            echo
            [ -f "$RUNNER_TEMP/stale.md" ] && { echo '---'; echo; cat "$RUNNER_TEMP/stale.md"; }
            # 도달성 표가 없으면 'fetch failed' 만 보고 원인을 추측하게 된다.
            [ -f "$RUNNER_TEMP/taxtable.md" ] && { echo; echo '---'; echo; echo '### 간이세액표 원문 대조'; echo; echo '```'; cat "$RUNNER_TEMP/taxtable.md"; echo '```'; }
            [ -f "$RUNNER_TEMP/reach.md" ] && { echo; echo '---'; echo; cat "$RUNNER_TEMP/reach.md"; }
          } > "$BODY"

          # 이번 실행이 '곧 틀려진다'(낡음 WARN) 뿐인지, '지금 문제다' 인지 가른다.
          URGENT=no
          [ "${{ steps.update.outputs.code }}" != "0" ] && URGENT=yes
          [ "${{ steps.stale.outputs.code }}" = "2" ] && URGENT=yes
          [ "${{ steps.taxtable.outputs.code }}" != "0" ] && URGENT=yes
          [ "${{ job.status }}" = "failure" ] && URGENT=yes

          N=$(gh issue list --state open --label rates-alert --json number --jq '.[0].number // empty' || true)
          if [ -n "$N" ]; then
            # ★낡음 WARN 만으로는 코멘트하지 않는다.★
            # 3시간마다 도는데 WARN 은 몇 주씩 지속된다. 매번 코멘트를 달면
            # 하루 8건씩 쌓여 정작 급한 알림이 그 속에 묻힌다. 이슈가 이미 열려
            # 있다는 것 자체가 '아직 처리 안 됨' 을 뜻하므로 반복은 정보가 아니다.
            if [ "$URGENT" = "no" ]; then
              echo "낡음 경보만 있고 이슈 #$N 이 이미 열려 있습니다. 코멘트를 생략합니다."
              exit 0
            fi
            gh issue comment "$N" --body-file "$BODY"
            echo "기존 이슈 #$N 에 코멘트했습니다(중복 방지)."
            exit 0
          fi

          # ★알림은 어떤 이유로도 침묵하면 안 된다.★
          # 라벨·담당자 지정이 실패해도 이슈 자체는 반드시 만든다. 라벨이 없어
          # 이슈 생성이 통째로 죽은 적이 있다(rates-alert not found). 부가 정보를
          # 붙이려다 본체를 잃는 것은 최악이다. 단계적으로 물러선다.
          TITLE="요율 자동 갱신 개입 필요 (${{ steps.cfg.outputs.today }})"
          gh issue create --title "$TITLE" --body-file "$BODY" \
              --label rates-alert --assignee windswepty \
          || gh issue create --title "$TITLE" --body-file "$BODY" --assignee windswepty \
          || gh issue create --title "$TITLE" --body-file "$BODY" \
          || {
               echo "::error::이슈 생성에 실패했습니다. 아래 내용을 직접 확인하십시오."
               cat "$BODY"
               exit 1
             }

      - name: 관측·리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rates-watch-${{ steps.cfg.outputs.today }}
          path: |
            data/candidates/
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/stale.md
          if-no-files-found: warn
          retention-days: 30

      # FATAL 이면 워크플로 자체를 실패시켜 GitHub 알림 경로도 태운다.
      - name: FATAL 이면 실패 처리
        if: steps.update.outputs.code == '2'
        run: |
          echo "::error::위생 검사 FATAL. 후보를 폐기했고 원장은 그대로입니다."
          exit 1
